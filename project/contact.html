<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8" >
        <meta name="viewport" content="width=device-width,initial-scale=1" >
        <title>Contact — Healthy Living Hub</title>
        <meta name="description" content="Contact and newsletter signup for Healthy Living Hub.">
        <meta name="author" content="Majok Aguer">
        <link rel="stylesheet" href="styles/project.css">
        <script src="scripts/project.js" defer></script>
    </head>

    <body>
        <header class="site-header">
            <div class="brand">
                <a href="index.html"><img src="images/logo.jpg" alt="Healthy Living Hub logo" class="logo" width="100"
                        height="100"></a>
                <h1>Healthy Living Hub</h1>
            </div>
            <nav class="main-nav" aria-label="Main navigation">
                <ul class="nav-list">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="nutrition.html">Nutrition</a></li>
                    <li><a href="fitness.html">Fitness</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <h2>Contact & Subscribe</h2>

            <form id="contactForm" class="card" novalidate aria-describedby="formHelp">
                <div id="formHelp" class="visually-hidden">Fill required fields then click Subscribe.</div>

                <label for="name">Full name</label>
                <input id="name" name="name" type="text" required minlength="2">

                <label for="email">Email</label>
                <input id="email" name="email" type="email" required>

                <label for="goal">Primary goal</label>
                <select id="goal" name="goal" required>
                    <option value="">Choose one</option>
                    <option value="weight">Lose weight</option>
                    <option value="energy">Improve energy</option>
                    <option value="strength">Build strength</option>
                </select>

                <fieldset>
                    <legend>Interests</legend>
                    <label><input type="checkbox" name="interest" value="nutrition"> Nutrition</label>
                    <label><input type="checkbox" name="interest" value="fitness"> Fitness</label>
                    <label><input type="checkbox" name="interest" value="mind"> Mindfulness</label>
                </fieldset>

                <label for="message">Message (optional)</label>
                <textarea id="message" name="message" rows="4"></textarea>

                <button type="submit">Subscribe</button>
                <div id="formMessage" aria-live="polite"></div>
            </form>
        </main>

        <footer class="site-footer">
            <p>&copy; <span id="currentyear"></span>🏃‍♀️ Healthy Living Hub 🏋️‍♂️</p>
            <p id="lastModified"></p>
            <p><a href="references.html">References</a></p>
        </footer>

       
    </body>

</html>
