<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Majok Aguer">
        <meta name="description" content="Product Review form for rating, product used and written feedback.">

        <title>Product Review</title>
        <link rel="stylesheet" href="styles/form.css">
        <script src="scripts/form.js" defer></script>
    </head>

    <body>

        <header class="page-header">
            <h1>Product Review</h1>
        </header>

        <main>
            <section class="form-card">
                <form method="get" action="review.html" id="reviewForm">

                    
                    <label for="product">Product Name</label>
                    <select id="product" name="product" required>
                        <option value="" disabled selected>Select a Product ...</option>
                    </select>

                    
                <div class="rating-group">
                    <p class="rating-label">Overall Rating</p>
                    <div class="stars-row">
                
                        <input type="radio" id="rating1" name="rating" value="1" required>
                        <label for="rating1">★</label>
                
                        <input type="radio" id="rating2" name="rating" value="2" >
                        <label for="rating2">★★</label>
                
                        <input type="radio" id="rating3" name="rating" value="3" >
                        <label for="rating3">★★★</label>
                
                        <input type="radio" id="rating4" name="rating" value="4" >
                        <label for="rating4">★★★★</label>
                
                        <input type="radio" id="rating5" name="rating" value="5" >
                        <label for="rating5">★★★★★</label>
                
                    </div>
                </div>

                    
                    <label for="installDate">Date of Installation</label>
                    <input type="date" id="installDate" name="installDate" required>

                    
                    <div class="features-section">
                        <p class="features-title">
                            Which features did you find useful in the product? <br>
                            <span class="small-text">(Check all that apply)</span>
                        </p>

                        <label for="durability">
                            <input type="checkbox" id="durability" name="features" value="Durability">
                            Durability
                        </label>

                        <label for="ease">
                            <input type="checkbox" id="ease" name="features" value="Ease of Use">
                            Ease of Use
                        </label>

                        <label for="performance">
                            <input type="checkbox" id="performance" name="features" value="Performance">
                            Performance
                        </label>

                        <label for="design">
                            <input type="checkbox" id="design" name="features" value="Design">
                            Design
                        </label>
                    </div>

                
                    <label for="reviewText">Written Review
                        <span class="small-text">(Optional)</span>
                    </label>
                    <textarea id="reviewText" name="reviewText" rows="4"></textarea>

                    
                    <label for="username">Your Name
                        <span class="small-text">(Optional)</span>
                    </label>
                    <input type="text" id="username" name="username">

                    
                    <input type="submit" value="Post Review" class="submit-btn">

                </form>
            </section>
        </main>

        <footer>
            <p>&copy; <span id="currentyear"></span> ✨ Majok Aguer ✨ | Uganda |</p>
            <p>Last Modified: <span id="lastModified"></span></p>
        </footer>


    </body>

</html>
